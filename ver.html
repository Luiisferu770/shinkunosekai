<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Cargando... - Shinku No Sekai</title>
    <link rel="icon" href="img/Logo/Shinku No Sekai icono.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

<header class="banner">
    <div class="logo-container">
        <a href="index.html">
            <img src="img/Logo/Shinku No Sekai Logo Horizontal.png"
                 alt="Shinku No Sekai Logo"
                 class="logo">
        </a>
    </div>

    <!-- BUSCADOR -->
    <div class="nav-search">
        <input type="text" id="buscador-header" placeholder="Buscar anime o película..." autocomplete="off">
        <div class="search-results-list" id="header-search-results"></div>
    </div>

    <nav class="nav-menu">
        <ul>
            <li><a href="top.html">Animes</a></li>
            <li><a href="peliculas.html">Peliculas</a></li>
            <li id="nav-login"><a href="login.html">Iniciar Sesion</a></li>
        </ul>
    </nav>

    <div class="menu-toggle">☰</div>
</header>

<main id="detail-main">
    <div class="detail-loading">Cargando información del anime...</div>
</main>

<footer>
    <p>&copy; 2026 Shinku No Sekai - Todos los derechos reservados</p>
</footer>

<!-- Plantilla de íconos genéricos (no logos oficiales, por temas de derechos de marca) -->
<template id="icon-external">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7zM5 5h6V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-6h-2v6H5V5z"/></svg>
</template>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const params = new URLSearchParams(window.location.search);
    const tituloParam = params.get("titulo") || params.get("id");
    const main = document.getElementById("detail-main");

    if (!tituloParam) {
        mostrarError("No se especificó ningún anime.");
        return;
    }

    fetch("animes.json")
        .then(res => res.json())
        .then(data => {
            const anime = data.find(a => a.titulo.toLowerCase() === tituloParam.toLowerCase());
            if (!anime) {
                mostrarError(`No encontramos "${tituloParam}" en el catálogo.`);
                return;
            }
            renderAnime(anime);
        })
        .catch(err => {
            console.error(err);
            mostrarError("Ocurrió un error cargando la información.");
        });

    function mostrarError(msg) {
        main.innerHTML = `
            <div class="detail-error">
                <p>${msg}</p>
                <p><a href="top.html">← Volver al listado de animes</a></p>
            </div>
        `;
    }

    function rutaImg(src, fallback) {
        if (!src) return fallback;
        return src.startsWith("img/") ? src : `img/${src}`;
    }

    function iconoExterno() {
        return document.getElementById("icon-external").innerHTML;
    }

    function renderAnime(anime) {
        document.getElementById("page-title").textContent = `${anime.titulo} - Shinku No Sekai`;

        const imagen = rutaImg(anime.imagen, "img/placeholder.jpg");
        const fondo = rutaImg(anime.fondo || anime.imagen, imagen);
        const tituloBusqueda = encodeURIComponent(anime.titulo);

        // Botones a plataformas oficiales (redirigen afuera, no reproducimos nada aquí)
        const plataformas = [
            { clase: "btn-crunchyroll", nombre: "Crunchyroll", url: `https://www.crunchyroll.com/search?q=${tituloBusqueda}` },
            { clase: "btn-netflix",     nombre: "Netflix",     url: `https://www.netflix.com/search?q=${tituloBusqueda}` },
            { clase: "btn-prime",       nombre: "Prime Video", url: `https://www.primevideo.com/search/ref=atv_nb_sug?phrase=${tituloBusqueda}&ie=UTF8` },
            { clase: "btn-disney",      nombre: "Disney+",     url: `https://www.disneyplus.com/search` },
            
        ];

        const botonesHtml = plataformas.map(p => `
            <a href="${p.url}" target="_blank" rel="noopener" class="platform-btn ${p.clase}">
                ${iconoExterno()} ${p.nombre}
            </a>
        `).join("");

        // Videos: trailer / opening / ending — usan IDs de YouTube si existen en el JSON
        const videos = [
            { campo: "trailer", label: "🎬 Trailer", busqueda: `${anime.titulo} trailer oficial` },
            { campo: "opening", label: "🎵 Opening", busqueda: `${anime.titulo} opening` },
            { campo: "ending",  label: "🎵 Ending",  busqueda: `${anime.titulo} ending` },
        ];

        const videosHtml = videos.map(v => {
            const ytId = anime[v.campo];
            if (ytId) {
                return `
                    <div class="video-card">
                        <iframe src="https://www.youtube.com/embed/${ytId}" title="${v.label}" allowfullscreen loading="lazy"></iframe>
                        <div class="video-label">${v.label}</div>
                    </div>
                `;
            }
            return `
                <div class="video-missing">
                    <p>${v.label} no cargado todavía.</p>
                    <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(v.busqueda)}" target="_blank" rel="noopener">
                        Buscar en YouTube →
                    </a>
                </div>
            `;
        }).join("");

        main.innerHTML = `
            <div class="detail-hero" style="background-image:url('${fondo}')" id="detail-hero-bg">
                <div class="detail-hero-content">
                    <img class="detail-poster" src="${imagen}" alt="${anime.titulo}"
                         onerror="handleImgError(this, '${anime.titulo.replace(/'/g, "\\'")}')">
                    <div class="detail-info">
                        <h1>${anime.titulo}</h1>
                        <p>${anime.descripcion}</p>
                        <div class="platform-buttons">
                            ${botonesHtml}
                        </div>
                    </div>
                </div>
            </div>

            <section class="detail-section">
                <h2>Trailers, Openings y Endings</h2>
                <div class="video-grid">
                    ${videosHtml}
                </div>
            </section>
        `;

        precargarOFallback(fondo, anime.titulo, (urlFinal) => {
            const heroBg = document.getElementById("detail-hero-bg");
            if (heroBg) heroBg.style.backgroundImage = `url('${urlFinal}')`;
        });
    }
});
</script>

</body>
</html>
