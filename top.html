<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animes - Shinku No Sekai</title>
    <link rel="icon" href="img/Logo/Shinku No Sekai icono.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

<header class="banner">

    <!-- LOGO -->
    <div class="logo-container">
        <a href="home.html">
            <img src="img/Logo/Shinku No Sekai Logo Horizontal.png"
                 alt="Shinku No Sekai Logo"
                 class="logo">
        </a>
    </div>

    <!-- MENÚ -->
    <nav class="nav-menu">
        <ul>
            <li><a href="top.html">Animes</a></li>
            <li><a href="peliculas.html">Peliculas</a></li>
            <li><a href="login.html">Iniciar Sesion</a></li>
        </ul>
    </nav>

    <!-- HAMBURGUESA -->
    <div class="menu-toggle">☰</div>

</header>

<main>
    <section class="top-list">
        <h1>Animes</h1>
        <div class="anime-container" id="anime-container"></div>
    </section>
</main>

<footer>
    <p>&copy; 2026 Shinku No Sekai - Todos los derechos reservados</p>
</footer>

<script>
document.addEventListener('DOMContentLoaded', () => {
  fetch('animes.json')
    .then(response => response.json())
    .then(data => {
      const container = document.getElementById('anime-container');

      data.forEach(anime => {
        const div = document.createElement('div');
        div.classList.add("anime-card");
        div.innerHTML = `
          <img src="${anime.imagen}" alt="${anime.titulo}">
          <div class="anime-info">
            <h3>${anime.titulo}</h3>
            <p>${anime.descripcion}</p>
            <button onclick="window.location.href='ver.html?titulo=${encodeURIComponent(anime.titulo)}'">
              Comenzar a ver
            </button>
          </div>
        `;
        container.appendChild(div);
      });
    })
    .catch(error => {
      console.error('Error al cargar los animes:', error);
    });
});
</script>

</body>
</html>
