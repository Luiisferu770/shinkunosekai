<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Películas - Shinku No Sekai</title>
    <link rel="icon" href="/img/Logo/Shinku No Sekai icono.png" type="image/png">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/pages/script.js" defer></script>
</head>

<body>

<header class="banner">

    <!-- LOGO -->
    <div class="logo-container">
        <a href="/index.html">
            <img src="/img/Logo/Shinku No Sekai Logo Horizontal.png"
                 alt="Shinku No Sekai Logo"
                 class="logo">
        </a>
    </div>

    <!-- BUSCADOR -->
    <div class="nav-search">
        <input type="text" id="buscador-header" placeholder="Buscar anime o película..." autocomplete="off">
        <div class="search-results-list" id="header-search-results"></div>
    </div>

    <!-- MENÚ -->
    <nav class="nav-menu">
        <ul>
            <li><a href="/pages/top.html">Animes</a></li>
            <li><a href="/pages/peliculas.html">Peliculas</a></li>
            <li id="nav-login"><a href="/pages/login.html">Iniciar Sesion</a></li>
        </ul>
    </nav>

    <!-- HAMBURGUESA -->
    <div class="menu-toggle">☰</div>

</header>

<main>
    <section class="top-list">
        <h1>Películas</h1>

        <!-- data-source y data-target le dicen a script.js de dónde cargar
             y a qué página mandar cada tarjeta -->
        <div class="anime-container"
             id="peliculas-container"
             data-source="/js/api/peliculas.json"
             data-target="/pages/ver-pelicula.html"></div>
    </section>
</main>

<footer>
    <p>&copy; 2026 Shinku No Sekai - Todos los derechos reservados</p>
</footer>
